name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to validate and release (without v)
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize trusted release ref
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      version: ${{ steps.gate.outputs.version }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
      checkout_ref: ${{ steps.gate.outputs.checkout_ref }}
    steps:
      - id: gate
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "Aaalice233/codex-unreal-blueprint" ]] || {
            echo "Releases run only in the canonical repository." >&2
            exit 1
          }
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            dry_run=false
            checkout_ref="${GITHUB_REF}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            version="${INPUT_VERSION}"
            dry_run="${INPUT_DRY_RUN:-true}"
            checkout_ref="${GITHUB_SHA}"
            [[ "${dry_run}" == true ]] || {
              echo "workflow_dispatch is verification-only; push an annotated v* tag to publish." >&2
              exit 1
            }
          else
            echo "Manual releases must run from main; automatic releases require a v* tag." >&2
            exit 1
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid SemVer: ${version}" >&2
            exit 1
          }
          echo "trusted=true" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${dry_run}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"

  build-and-release:
    name: Build, verify, and publish
    needs: authorize
    if: needs.authorize.outputs.trusted == 'true'
    environment: release
    runs-on: [self-hosted, Windows, X64, trusted, ue4.27]
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      DRY_RUN: ${{ needs.authorize.outputs.dry_run }}
      UE_4_27_ROOT: ${{ vars.UE_4_27_ROOT }}
      CODEX_UNREAL_UPROJECT: ${{ vars.CODEX_UNREAL_UPROJECT }}
    steps:
      - name: Checkout trusted release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.checkout_ref }}
          persist-credentials: false
          clean: true

      - name: Block incomplete release implementations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'package.json',
            'scripts/dev.ps1',
            'unreal/CodexUnrealBlueprint/CodexUnrealBlueprint.uplugin'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing.Count -gt 0) {
            throw "Release is intentionally blocked until implementation exists: $($missing -join ', ')"
          }
          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $plugin = Get-Content -LiteralPath 'unreal/CodexUnrealBlueprint/CodexUnrealBlueprint.uplugin' -Raw | ConvertFrom-Json
          if ($package.version -ne $env:RELEASE_VERSION) {
            throw "package.json version $($package.version) does not match $env:RELEASE_VERSION"
          }
          if ($plugin.VersionName -ne $env:RELEASE_VERSION) {
            throw "Plugin VersionName $($plugin.VersionName) does not match $env:RELEASE_VERSION"
          }
          if (-not $env:UE_4_27_ROOT) { throw 'UE_4_27_ROOT repository variable is required.' }
          if (-not $env:CODEX_UNREAL_UPROJECT) { $env:CODEX_UNREAL_UPROJECT = 'E:/Master/LuaSocial.uproject' }
          if (-not (Test-Path -LiteralPath $env:CODEX_UNREAL_UPROJECT)) {
            throw "Configured test project does not exist: $env:CODEX_UNREAL_UPROJECT"
          }

      - name: Install and run complete checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CODEX_UNREAL_UPROJECT) { $env:CODEX_UNREAL_UPROJECT = 'E:/Master/LuaSocial.uproject' }
          npm ci --ignore-scripts
          ./scripts/verify-release.ps1 -Version $env:RELEASE_VERSION
          ./scripts/dev.ps1 check `
            -UProject $env:CODEX_UNREAL_UPROJECT `
            -EngineRoot $env:UE_4_27_ROOT `
            -RunUnrealTests

      - name: Build UE4.27 Win64 plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runUat = Join-Path $env:UE_4_27_ROOT 'Engine/Build/BatchFiles/RunUAT.bat'
          if (-not (Test-Path -LiteralPath $runUat)) { throw "RunUAT not found: $runUat" }
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          & $runUat BuildPlugin `
            -Plugin="$((Resolve-Path 'unreal/CodexUnrealBlueprint/CodexUnrealBlueprint.uplugin').Path)" `
            -Package="$((Resolve-Path 'artifacts').Path)/CodexUnrealBlueprint-UE4.27-Win64" `
            -TargetPlatforms=Win64 `
            -Rocket
          if ($LASTEXITCODE -ne 0) { throw "RunUAT BuildPlugin failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path 'artifacts/CodexUnrealBlueprint-UE4.27-Win64/*' `
            -DestinationPath "artifacts/CodexUnrealBlueprint-$env:RELEASE_VERSION-UE4.27-Win64.zip"

      - name: Pack Codex plugin and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "artifacts/codex-unreal-blueprint-$env:RELEASE_VERSION-codex-plugin"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($item in @('.codex-plugin', '.mcp.json', 'dist', 'skills', 'LICENSE', 'README.md', 'README.zh-CN.md')) {
            Copy-Item -LiteralPath $item -Destination $stage -Recurse -Force
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/codex-unreal-blueprint-$env:RELEASE_VERSION-codex-plugin.zip"
          $packages = Get-ChildItem -LiteralPath 'artifacts' -File |
            Where-Object { $_.Extension -eq '.zip' } |
            Sort-Object Name
          if ($packages.Count -ne 2) { throw "Expected one UE zip and one Codex plugin zip, found $($packages.Count)." }
          $checksums = $packages | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Encoding ascii -LiteralPath 'artifacts/SHA256SUMS.txt'
          ./scripts/get-release-notes.ps1 -Version $env:RELEASE_VERSION -Output 'artifacts/RELEASE_NOTES.md'

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.authorize.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.DRY_RUN != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          $pluginArchive = "artifacts/CodexUnrealBlueprint-$env:RELEASE_VERSION-UE4.27-Win64.zip"
          $codexArchive = "artifacts/codex-unreal-blueprint-$env:RELEASE_VERSION-codex-plugin.zip"
          foreach ($asset in @($pluginArchive, $codexArchive, 'artifacts/SHA256SUMS.txt')) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Release asset not found: $asset" }
          }
          gh release create $tag `
            $pluginArchive $codexArchive 'artifacts/SHA256SUMS.txt' `
            --verify-tag --title $tag --notes-file 'artifacts/RELEASE_NOTES.md'
